name: AI Issue Handler

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-issue:
    name: Process Issue with AI
    runs-on: ubuntu-latest
    # 只处理有特定标签的 Issue
    if: |
      contains(github.event.issue.labels.*.name, 'enhancement') ||
      contains(github.event.issue.labels.*.name, 'bug')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ANTHROPIC_BASE_URL: https://open.bigmodel.cn/api/anthropic
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf "处理 GitHub Issue #%s: %s\n\nIssue 内容:\n%s\n\n请根据 CLAUDE.md 中的规范处理此 Issue。如果是新增汉字，在 data.js 中添加该字的数据，确保四个字形阶段都有完整的 SVG 路径和描述。运行 node tests/validate-data.js 验证，然后创建分支、提交并创建 Pull Request。\n" "$ISSUE_NUMBER" "$ISSUE_TITLE" "$ISSUE_BODY" | npx -y @anthropic-ai/claude-code

      - name: Comment on Issue (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ 处理失败，请检查日志或联系维护者。'
            })
